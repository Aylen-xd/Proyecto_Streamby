<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModaAyuda!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="scene-style">

<!--  Barra superior -->
<nav class="top-bar">
    <div class="logo">ModaAyuda!</div>
    <div class="nav-links">
        <a href="#" class="btn">Iniciar sesión</a>
        <a href="#" class="btn">Registrarse</a>
    </div>
</nav>

<!--  Encabezado -->
<header>
    <h1>Encuentra tu estilo ideal</h1>
    <p class="subtitle">Busca inspiración según tu vibra</p>

    <form id="search-form">
        <input type="text" id="search-input" placeholder="Ej: punk">
        <button type="submit">🔍 Buscar</button>
    </form>
</header>

<main>
    <section id="results">
        <p>Escribí un estilo para descubrir ideas de ropa y cuáles van con vos</p>
        <div id="gallery"></div>
    </section>
</main>

<footer>
    <p>Hecho por Aylen Toledo, Keila Mateo y Geraldine Vargas</p>
</footer>

<script>
    const outfits = {
        "punk": [
            "imagenes/punk.jpeg",
        ],
        "kawaii": [
            "imagenes/kawaii.jpeg",
        ],
        "grunge": [
            "imagenes/grunge.jpeg"
        ],
        "vintage": [
            "imagenes/vintage.jpeg",
        ]
    };
    

document.getElementById("search-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const search = document.getElementById("search-input").value.toLowerCase();
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";
    if (outfits[search]) {
        outfits[search].forEach(url => {
            const img = document.createElement("img");
            img.src = url;
            gallery.appendChild(img);
        });
    } else {
        gallery.innerHTML = "<p>No se encontraron resultados para ese estilo </p>";
    }
});
</script>

</body>
</html>
